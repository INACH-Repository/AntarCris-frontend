<div class="position-relative hero">
  <div class="background-image-wrapper">
    <!-- Background image -->
    <img class="background-image" ngSrc="assets/dspace/images/antarctic-landscape.jpg" alt="background" [fill]="true" [priority]="true"/>
    <div class="image-filter"></div>
  </div>

  <div class="hero-content position-relative container">
    <div class="banner-info">
      <div class="banner-text">
        <!-- Hero image -->
        <picture>
          <source type="image/svg+xml" srcset="assets/dspace/images/nodo_logo_white.svg 2000w">
          <img src="assets/dspace/images/nodo_logo_white.svg" alt="NODO Antartico logo">
        </picture>
      </div>
      <div class="banner-description">
        <h3 class="display-4">CRIS PROCIEN</h3>
        <p style="font-size: 22px">Repositorio institucional del PROCIEN</p>
      </div>
    </div>

    <div class="banner-search">
      <ds-search-section [sectionId]="sectionId" [searchSection]="searchSection"></ds-search-section>
    </div>

    <div class="banner-counters">
      <ng-container *ngFor="let sectionComponentRow of ( sectionComponents | async )">
        <ng-container *ngFor="let sectionComponent of sectionComponentRow"
          [ngSwitch]="sectionComponent.componentType">
          <div *ngSwitchCase="'counters'" class="counters-container">
            <div [class]="componentClass(sectionComponent)" class="col-md-12">
              <div class="col-md-12 counters-section">
                <ds-counters-section [sectionId]="sectionId"
                  [countersSection]="$any(sectionComponent)"></ds-counters-section>
                </div>
              </div>
            </div>
        </ng-container>
      </ng-container>
    </div>
  </div>

</div>
