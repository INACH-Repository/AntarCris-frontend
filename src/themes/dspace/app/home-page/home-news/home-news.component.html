<div class="background-image-container mt-ncs">
  <div class="container">
    <div class="jumbotron jumbotron-fluid">
      <ds-text-section *ngIf="hasHomeNewsMetadata; else dsDefaultHomeNews" [sectionId]="'site'" [textRowSection]="homeNewsSection"
                              [site]="(site$ | async)"></ds-text-section>
    </div>
  </div>
  <!-- Lugar donde cambiar la imagen -->
  <picture class="background-image">
    <source type="image/png" srcset="assets/dspace/images/12.png 2000w">
    <img alt="" [src]="'assets/dspace/images/12.png'"/>
  </picture>
  <!--<small class="credits">Photo by <a href="https://www.pexels.com/@inspiredimages">&#64;inspiredimages</a></small>-->
</div>

<ng-template #dsDefaultHomeNews>
  <div class="d-flex flex-wrap">
    <div>
      <h1 class="display-3">CRIS PROCIEN</h1>
    </div>
  </div>
</ng-template>
